---
- name: Install Go toolchain
  ansible.builtin.apt:
    name: golang-go
    state: present

- name: Copy credential broker source
  ansible.builtin.copy:
    src: credential-broker/
    dest: "{{ agent_build_dir }}/credential-broker/"
    owner: root
    group: root
    mode: "0644"
  register: broker_src

- name: Build credential broker binary
  ansible.builtin.command:
    cmd: go build -o /usr/local/bin/credential-broker .
    chdir: "{{ agent_build_dir }}/credential-broker"
  environment:
    HOME: /root
  when: broker_src.changed
  notify: restart credential-broker

- name: Write the real Anthropic API key to a root-only file
  ansible.builtin.copy:
    dest: "{{ anthropic_api_key_file }}"
    content: "{{ anthropic_api_key }}"
    owner: root
    group: root
    mode: "0600"
  notify: restart credential-broker

- name: Create broker token directory
  ansible.builtin.file:
    path: "{{ broker_tokens_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install credential-broker systemd unit
  ansible.builtin.template:
    src: credential-broker.service.j2
    dest: /etc/systemd/system/credential-broker.service
    owner: root
    group: root
    mode: "0644"
  notify: restart credential-broker

- name: Ensure credential-broker is running and enabled
  ansible.builtin.systemd:
    name: credential-broker
    daemon_reload: true
    state: started
    enabled: true
