---
kata_version: "4.0.0"
kata_static_asset: "kata-static-{{ kata_version }}-amd64.tar.zst"
kata_static_url: "https://github.com/kata-containers/kata-containers/releases/download/{{ kata_version }}/{{ kata_static_asset }}"
kata_conf_file: "/opt/kata/share/defaults/kata-containers/configuration-clh.toml"

nerdctl_version: "2.3.5"
nerdctl_asset: "nerdctl-{{ nerdctl_version }}-linux-amd64.tar.gz"
nerdctl_url: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/{{ nerdctl_asset }}"

agent_host_dirs:
  - /srv/runs
  - /srv/git
  - /srv/agent/etc
  - /srv/agent/log

agent_bridge_name: "agentbr0"
agent_bridge_subnet: "10.88.0.0/24"
agent_bridge_gateway: "10.88.0.1"

squid_http_port: 3128
git_remote_port: 3000
credential_broker_port: 8081
mcp_port_range: "9100-9199"

allowed_domains_file: /srv/agent/etc/allowed_domains.txt
squid_access_log: /srv/agent/log/squid-access.log

agent_build_dir: /opt/agent-host/src

broker_tokens_dir: /srv/agent/etc/broker-tokens
anthropic_api_key_file: /srv/agent/etc/anthropic_api_key
broker_log: /srv/agent/log/broker.log

